name: Release

# Builds the extension zip from the default branch, then tags the release and attaches the zip to
# it. Uploading to extensions.gnome.org stays manual (docs/release.md): it needs a login and goes
# through a human review there.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.2.0 or v1.2.0 (empty: derive from the commits since the last release)"
        required: false
        type: string
      dry_run:
        description: "Dry run: resolve the version and print the plan, change nothing"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # simple-tag-and-release refuses any other branch too, but only after the build; failing here
  # first spares a wrong dispatch the whole toolchain install.
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to release anything but the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Dispatch the release from $DEFAULT_BRANCH, not $REF." >&2
            exit 1
          fi

  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # The same toolchain as the extension job in ci.yaml, which says what each package is for.
      - name: Install the GNOME toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gjs libglib2.0-bin gnome-shell unzip gettext

      - name: Install the node toolchain
        run: npm ci

      # Everything CI runs, ending with ext-pack and its bundle check: a release never ships a zip
      # that did not pass the checks on this very commit.
      - name: Verify and pack the extension
        run: make verify

      - name: Upload the packed extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shell-extension-zip
          path: dist/monmux@leinardi.github.io.shell-extension.zip
          if-no-files-found: error

  release:
    needs: build
    permissions:
      contents: write
    uses: leinardi/gh-reusable-workflows/.github/workflows/simple-tag-and-release.yaml@4b8d094239089d9f91fd15b929db30fcb2a3c118 # v1.3.1
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ inputs.dry_run }}
      artifact_name: shell-extension-zip
