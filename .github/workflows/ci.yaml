name: CI

# No job here runs the real monmux, and none of them touches a monitor. There is
# no monitor in CI, and the rule that no automation writes to one is not
# suspended because the automation is called a workflow - AGENTS.md,
# docs/testing.md. The test suite refuses to start unless the monmux on PATH is
# the fake in tests/bin, so a runner needs neither monmux nor ddcutil installed.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # gjs runs the test suite; libglib2.0-bin provides glib-compile-schemas;
      # gnome-shell provides `gnome-extensions`, which packs the zip - not
      # gnome-shell-common, which carries only data files and no binary;
      # unzip is what scripts/check-bundle.js reads the packed zip with; gettext
      # provides xgettext, msgcmp and msgfmt, which the template check runs and
      # `gnome-extensions pack --podir` compiles the translations with.
      - name: Install the GNOME toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gjs libglib2.0-bin gnome-shell unzip gettext

      - name: Install the node toolchain
        run: npm ci

      - name: Lint
        run: make ext-lint

      - name: Type-check
        run: make ext-typecheck

      - name: Test
        run: make ext-test

      - name: Check the translation template
        run: make ext-pot-check

      - name: Compile the schema
        run: make ext-schemas

      - name: Pack the extension
        run: make ext-pack

      - name: Upload the packed extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-extension-zip
          path: dist/*.shell-extension.zip
          if-no-files-found: error

  # The authoritative lint gate: every pre-commit hook over every file, with the versions pinned in
  # .pre-commit-config.yaml. The reviewdog jobs below only annotate a pull request's diff.
  pre-commit-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ext-metadata runs scripts/check-metadata.js, which needs node and nothing from npm.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # ext-schemas needs glib-compile-schemas, from libglib2.0-bin. The rest of the hooks bring
      # their own environments (pre-commit builds them), or need only bash and git.
      - name: Install glib-compile-schemas
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglib2.0-bin

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: pip install --no-cache-dir pre-commit==4.6.2

      # Restore only: pre-commit-warmup.yaml saves the entry on main under the same key.
      - name: Restore the pre-commit cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}

      # Skipped here because the extension job runs exactly the same npm scripts over the whole
      # tree (make ext-lint, ext-typecheck, ext-test), with the node_modules and gjs they need:
      # ext-eslint, ext-typecheck, ext-test.
      - name: Run every pre-commit hook on every file
        env:
          SKIP: ext-eslint,ext-typecheck,ext-test
        run: pre-commit run --all-files --show-diff-on-failure

      # pre-commit fails a hook that modifies a tracked file, which covers the auto-fixing hooks
      # (markdownlint fix, prettier, end-of-file-fixer); this also fails on a file a hook creates,
      # which its diff check does not see, so no fix can pass silently.
      - name: Fail if a hook modified a file
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  actionlint:
    # Reports inline PR review comments over a diff range; a push or a manual
    # dispatch has neither a pull request to comment on nor a base ref to diff
    # against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run actionlint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/actionlint@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  pre-commit-hooks:
    # Reports inline PR review comments over a diff range; a push or a manual
    # dispatch has neither a pull request to comment on nor a base ref to diff
    # against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ext-schemas needs glib-compile-schemas; ext-metadata needs node, which
      # the composite action's runner already has.
      - name: Install glib-compile-schemas
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libglib2.0-bin

      # ext-eslint, ext-typecheck and ext-test are deliberately absent: they are
      # `language: system` hooks that need this repository's node_modules, which
      # the composite action does not install. The `extension` job above is the
      # real thing and runs all three.
      - name: Run pre-commit hooks + reviewdog diff
        uses: leinardi/gha-pre-commit-reviewdog-actions/pre-commit-hooks@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          hooks: |
            check-merge-conflict
            end-of-file-fixer
            trailing-whitespace
            check-yaml
            check-json
            check-toml
            check-added-large-files
            checkmake
            prettier-yaml
            ext-schemas
            ext-metadata

  markdownlint:
    # Reports inline PR review comments over a diff range; a push or a manual
    # dispatch has neither a pull request to comment on nor a base ref to diff
    # against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run markdownlint-cli2 via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/markdownlint-cli2@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    # Reports inline PR review comments over a diff range; a push or a manual
    # dispatch has neither a pull request to comment on nor a base ref to diff
    # against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run shellcheck via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/shellcheck@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  yamllint:
    # Reports inline PR review comments over a diff range; a push or a manual
    # dispatch has neither a pull request to comment on nor a base ref to diff
    # against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run yamllint via pre-commit + reviewdog
        uses: leinardi/gha-pre-commit-reviewdog-actions/yamllint@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  conventional-commits:
    # The release version is derived from the commit types since the last tag,
    # so a commit nobody can classify is a release nobody can version. The local
    # commit-msg hook only runs where `make pre-commit-install` was run; this job
    # is the check that no commit skips. It runs the repository's own
    # conventional-pre-commit hook, so --force-scope applies here too, and it
    # skips merge commits. No pull-request title check: squash merging is
    # disabled, so a title never becomes a commit on main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate the commit messages
        uses: leinardi/gha-pre-commit-reviewdog-actions/conventional-commits@007919a45a04b0c52dfbb46732019dc4831fc03c # v1.0.3
        with:
          from-ref: ${{ github.event.pull_request.base.sha }}
          to-ref: ${{ github.event.pull_request.head.sha }}

  # The one required check that stands for the rest: GitHub counts a skipped required job as passing,
  # so this job runs always and decides. On a pull request every needed job must succeed; on a push
  # or a dispatch conventional-commits is skipped and the others must succeed. The reviewdog jobs
  # only annotate a pull request, so none of them is needed here.
  ci-result:
    if: always()
    needs:
      - extension
      - pre-commit-all
      - conventional-commits
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          failed="$(jq -r --arg event "${EVENT}" '
            to_entries[]
            | select(.value.result != "success")
            | select(
                (
                  $event != "pull_request"
                  and .key == "conventional-commits"
                  and .value.result == "skipped"
                ) | not
              )
            | "\(.key): \(.value.result)"
          ' <<<"${NEEDS}")"
          if [[ -n "${failed}" ]]; then
            echo "::error::Needed jobs did not succeed:"
            echo "${failed}"
            exit 1
          fi
          echo "Every needed job succeeded."
